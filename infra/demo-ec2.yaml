AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ハンズオンデモ環境 EC2 インスタンス
  研修前日に起動 → 研修後に停止する運用を想定

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 インスタンスタイプ

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH 接続用のキーペア名

  AllowedSSHCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: SSH アクセスを許可する CIDR (研修会場の IP に制限推奨)

  GitHubRepo:
    Type: String
    Default: https://github.com/trainocate-japan/Advanced-Generative-AI-Development-on-AWS.git
    Description: ハンズオンリポジトリの URL

Resources:
  # IAM Role (Bedrock, S3, CloudWatch, etc.)
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HandsonDemoEC2Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccessV2
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/AmazonComprehendFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/IAMFullAccess
      Policies:
        - PolicyName: BedrockAgentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agent:*
                  - bedrock-agent-runtime:*
                  - aoss:*
                Resource: '*'

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DemoInstanceRole

  # Security Group
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Handson Demo EC2 Security Group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          CidrIp: !Ref AllowedSSHCidr
          Description: Streamlit demo apps

  # EC2 Instance
  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref DemoInstanceProfile
      SecurityGroups:
        - !Ref DemoSecurityGroup
      ImageId: !FindInMap [RegionAMI, !Ref 'AWS::Region', AMI]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: HandsonDemoInstance
        - Key: Project
          Value: AdvancedGenAIDev
        - Key: AutoStop
          Value: "true"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > /var/log/user-data.log 2>&1

          echo "=== ハンズオンデモ環境セットアップ開始 ==="

          # システム更新
          yum update -y

          # 基本ツールのインストール
          yum install -y git python3.12 python3.12-pip nodejs npm jq

          # Python のデフォルト設定
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          alternatives --set python3 /usr/bin/python3.12

          # AWS SAM CLI のインストール
          pip3.12 install aws-sam-cli

          # Python ライブラリのインストール
          pip3.12 install boto3 streamlit

          # AWS CDK のインストール
          npm install -g aws-cdk

          # リポジトリのクローン
          cd /home/ec2-user
          git clone ${GitHubRepo} handson-repo
          chown -R ec2-user:ec2-user handson-repo

          # セットアップスクリプトの実行
          cd handson-repo
          if [ -f infra/setup-demo-env.sh ]; then
            chmod +x infra/setup-demo-env.sh
            sudo -u ec2-user bash infra/setup-demo-env.sh
          fi

          echo "=== セットアップ完了 ==="

  # Auto Stop (EventBridge + Lambda で毎日23時に自動停止)
  StopInstanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: StopHandsonDemoInstance
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt StopInstanceRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref DemoInstance
      Code:
        ZipFile: |
          import boto3
          import os
          def handler(event, context):
              ec2 = boto3.client('ec2')
              instance_id = os.environ['INSTANCE_ID']
              ec2.stop_instances(InstanceIds=[instance_id])
              print(f"Stopped instance: {instance_id}")
              return {"status": "stopped"}

  StopInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StopEC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  StopScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: 毎日23時にデモインスタンスを自動停止
      ScheduleExpression: cron(0 14 * * ? *)  # UTC 14:00 = JST 23:00
      State: ENABLED
      Targets:
        - Arn: !GetAtt StopInstanceFunction.Arn
          Id: StopDemoInstance

  StopSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopInstanceFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduleRule.Arn

Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0c02fb55956c7d316  # Amazon Linux 2023
    us-west-2:
      AMI: ami-0735c191cf914754d
    ap-northeast-1:
      AMI: ami-0d52744d6551d851e

Outputs:
  InstanceId:
    Value: !Ref DemoInstance
    Description: EC2 Instance ID

  PublicIP:
    Value: !GetAtt DemoInstance.PublicIp
    Description: パブリック IP (起動のたびに変わる可能性あり)

  SSHCommand:
    Value: !Sub "ssh -i ${KeyPairName}.pem ec2-user@${DemoInstance.PublicIp}"
    Description: SSH 接続コマンド

  StartCommand:
    Value: !Sub "aws ec2 start-instances --instance-ids ${DemoInstance}"
    Description: 研修前日にインスタンスを起動するコマンド

  StopCommand:
    Value: !Sub "aws ec2 stop-instances --instance-ids ${DemoInstance}"
    Description: 研修後にインスタンスを停止するコマンド
