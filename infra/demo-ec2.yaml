AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ハンズオンデモ環境 EC2 インスタンス
  Session Manager 経由で接続。研修前日に起動 → 研修後に自動停止。
  ハンズオン資材は S3 バケットからダウンロード。

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 インスタンスタイプ

  AssetsBucket:
    Type: String
    Description: ハンズオン資材がアップロードされた S3 バケット名

  AssetsPrefix:
    Type: String
    Default: handson-assets
    Description: S3 バケット内のプレフィックス

Resources:
  # ==========================================================================
  # VPC
  # ==========================================================================
  DemoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: HandsonDemoVPC

  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: HandsonDemoSubnet

  DemoIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: HandsonDemoIGW

  DemoIGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVPC
      InternetGatewayId: !Ref DemoIGW

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVPC
      Tags:
        - Key: Name
          Value: HandsonDemoRT

  DemoRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoIGWAttachment
    Properties:
      RouteTableId: !Ref DemoRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoIGW

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DemoSubnet
      RouteTableId: !Ref DemoRouteTable

  # ==========================================================================
  # Security Group (Inbound不要 - Session Manager経由のためアウトバウンドのみ)
  # ==========================================================================
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Handson Demo - Session Manager only
      VpcId: !Ref DemoVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (SSM, Bedrock API, S3, etc.)
      Tags:
        - Key: Name
          Value: HandsonDemoSG

  # ==========================================================================
  # IAM Role (Session Manager + Bedrock + S3 + その他)
  # ==========================================================================
  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: HandsonDemoEC2Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccessV2
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonSQSFullAccess
        - arn:aws:iam::aws:policy/ComprehendFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
      Policies:
        - PolicyName: BedrockAgentAndOpenSearch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agent:*
                  - bedrock-agent-runtime:*
                  - aoss:*
                  - s3vectors:*
                Resource: '*'
        - PolicyName: SSMParameterStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:RemoveTagsFromResource
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/genai/*"
        - PolicyName: AppConfigAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - appconfig:*
                Resource: '*'

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DemoInstanceRole

  # ==========================================================================
  # EC2 Instance
  # ==========================================================================
  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DemoInstanceProfile
      SubnetId: !Ref DemoSubnet
      SecurityGroupIds:
        - !Ref DemoSecurityGroup
      ImageId: !FindInMap [RegionAMI, !Ref 'AWS::Region', AMI]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: HandsonDemoInstance
        - Key: Project
          Value: AdvancedGenAIDev
        - Key: AutoStop
          Value: "true"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          exec > /var/log/user-data.log 2>&1

          echo "=========================================="
          echo " ハンズオンデモ環境セットアップ開始"
          echo " $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

          # システム更新と基本ツール (Amazon Linux 2023 = dnf ベース)
          echo "[1/6] システム更新..."
          dnf update -y
          dnf install -y python3.12 python3.12-pip jq unzip tar nodejs npm git

          # Python 設定
          echo "[2/6] Python ライブラリ..."
          pip3.12 install --upgrade pip
          pip3.12 install boto3 streamlit numpy pandas opensearch-py requests-aws4auth

          # AWS SAM CLI
          echo "[3/6] SAM CLI..."
          pip3.12 install aws-sam-cli

          # AWS CDK
          echo "[4/6] CDK..."
          npm install -g aws-cdk

          # S3 からハンズオン資材をダウンロード
          echo "[5/6] S3 から資材ダウンロード..."
          WORK_DIR=/home/ec2-user/handson
          mkdir -p $WORK_DIR
          aws s3 cp s3://${AssetsBucket}/${AssetsPrefix}/handson.tar.gz /tmp/handson.tar.gz
          tar -xzf /tmp/handson.tar.gz -C $WORK_DIR --strip-components=1
          rm -f /tmp/handson.tar.gz
          chown -R ec2-user:ec2-user $WORK_DIR

          # M03用 S3 バケットとサンプルドキュメント
          echo "[6/6] デモ用リソース準備..."
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          AWS_REGION=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
          if [ -z "$AWS_REGION" ]; then AWS_REGION=us-east-1; fi
          KB_BUCKET="legal-kb-demo-$AWS_ACCOUNT"

          if ! aws s3 ls "s3://$KB_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3 mb "s3://$KB_BUCKET"
            else
              aws s3 mb "s3://$KB_BUCKET" --region "$AWS_REGION"
            fi
          fi
          if [ -d "$WORK_DIR/M03-rag-knowledgebase/sample-docs" ]; then
            aws s3 sync "$WORK_DIR/M03-rag-knowledgebase/sample-docs/" "s3://$KB_BUCKET/documents/" --quiet
          fi

          # デモ実行ヘルパー (S3 から取得済みのものをホームにコピー)
          cp $WORK_DIR/run-demo.sh /home/ec2-user/run-demo.sh
          chmod +x /home/ec2-user/run-demo.sh
          chown ec2-user:ec2-user /home/ec2-user/run-demo.sh

          # リージョン設定
          sudo -u ec2-user aws configure set region $AWS_REGION

          # Bedrock モデル確認
          echo ""
          echo "=== Bedrock モデルアクセス確認 ==="
          for model in amazon.nova-lite-v1:0 amazon.nova-pro-v1:0 amazon.titan-embed-text-v2:0; do
            r=$(aws bedrock get-foundation-model --model-identifier "$model" --query "modelDetails.modelId" --output text 2>/dev/null || echo "NG")
            [ "$r" != "NG" ] && echo "  ✅ $model" || echo "  ⚠  $model (要有効化)"
          done

          echo ""
          echo "=========================================="
          echo " セットアップ完了! $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

  # ==========================================================================
  # Auto Stop (EventBridge + Lambda: 毎日 23:00 JST に自動停止)
  # ==========================================================================
  StopInstanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: StopHandsonDemoInstance
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt StopInstanceRole.Arn
      Environment:
        Variables:
          INSTANCE_ID: !Ref DemoInstance
      Code:
        ZipFile: |
          import boto3
          import os
          def handler(event, context):
              ec2 = boto3.client('ec2')
              instance_id = os.environ['INSTANCE_ID']
              ec2.stop_instances(InstanceIds=[instance_id])
              print(f"Stopped instance: {instance_id}")
              return {"status": "stopped"}

  StopInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StopEC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  StopScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: 毎日 23:00 JST (UTC 14:00) にデモインスタンスを自動停止
      ScheduleExpression: cron(0 14 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt StopInstanceFunction.Arn
          Id: StopDemoInstance

  StopSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopInstanceFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduleRule.Arn

# ==========================================================================
# Mappings
# ==========================================================================
Mappings:
  RegionAMI:
    us-east-1:
      AMI: ami-0bdc7d025135d7b49
    us-west-2:
      AMI: ami-0735c191cf914754d
    ap-northeast-1:
      AMI: ami-0d52744d6551d851e

# ==========================================================================
# Outputs
# ==========================================================================
Outputs:
  InstanceId:
    Value: !Ref DemoInstance
    Description: EC2 Instance ID

  SessionManagerConnect:
    Value: !Sub "aws ssm start-session --target ${DemoInstance} --region ${AWS::Region}"
    Description: Session Manager 接続コマンド

  ConsoleURL:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${DemoInstance}"
    Description: Session Manager コンソール URL

  StartCommand:
    Value: !Sub "aws ec2 start-instances --instance-ids ${DemoInstance} --region ${AWS::Region}"
    Description: インスタンス起動コマンド

  StopCommand:
    Value: !Sub "aws ec2 stop-instances --instance-ids ${DemoInstance} --region ${AWS::Region}"
    Description: インスタンス停止コマンド

  VpcId:
    Value: !Ref DemoVPC
    Description: VPC ID
