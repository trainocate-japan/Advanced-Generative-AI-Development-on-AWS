AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Module 1 - Dynamic Model Selection with Circuit Breaker Pattern

Globals:
  Function:
    Timeout: 60
    Runtime: python3.12
    MemorySize: 512

Resources:
  # API Gateway
  ModelSelectionApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

  # AWS AppConfig - Application
  ModelSelectionAppConfigApp:
    Type: AWS::AppConfig::Application
    Properties:
      Name: genai-model-selection

  # AWS AppConfig - Environment
  ModelSelectionAppConfigEnv:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId: !Ref ModelSelectionAppConfigApp
      Name: production

  # AWS AppConfig - Configuration Profile (Freeform)
  ModelSelectionConfigProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref ModelSelectionAppConfigApp
      Name: routing-config
      LocationUri: hosted
      Type: AWS.Freeform

  # AWS AppConfig - Hosted Configuration Version (初期設定)
  ModelSelectionConfigVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref ModelSelectionAppConfigApp
      ConfigurationProfileId: !Ref ModelSelectionConfigProfile
      ContentType: application/json
      Content: |
        {
          "routing_rules": {
            "simple": {
              "primary": "amazon.nova-lite-v1:0",
              "fallback": "amazon.nova-lite-v1:0"
            },
            "medium": {
              "primary": "amazon.nova-pro-v1:0",
              "fallback": "amazon.nova-lite-v1:0"
            },
            "complex": {
              "primary": "us.anthropic.claude-sonnet-4-5-20250929-v1:0",
              "fallback": "amazon.nova-pro-v1:0"
            }
          },
          "circuit_breaker": {
            "failure_threshold": 5,
            "timeout_seconds": 30
          },
          "cost_budget": {
            "daily_limit_usd": 50,
            "budget_exceeded_model": "amazon.nova-lite-v1:0"
          },
          "classification_keywords": {
            "complex": ["分析", "評価", "設計", "比較", "アーキテクチャ", "リスク", "コンプライアンス", "最適化", "戦略"],
            "simple": ["とは", "何ですか", "教えて", "リスト", "一覧"]
          }
        }

  # AWS AppConfig - Deployment Strategy (即時デプロイ)
  ImmediateDeployStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: Immediate
      DeploymentDurationInMinutes: 0
      GrowthFactor: 100
      FinalBakeTimeInMinutes: 0
      ReplicateTo: NONE

  # AWS AppConfig - Initial Deployment
  ModelSelectionConfigDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref ModelSelectionAppConfigApp
      EnvironmentId: !Ref ModelSelectionAppConfigEnv
      ConfigurationProfileId: !Ref ModelSelectionConfigProfile
      ConfigurationVersion: !Ref ModelSelectionConfigVersion
      DeploymentStrategyId: !Ref ImmediateDeployStrategy

  # Lambda Router Function
  RouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: genai-model-router
      CodeUri: lambda/
      Handler: router.lambda_handler
      Environment:
        Variables:
          APPCONFIG_APP: !Ref ModelSelectionAppConfigApp
          APPCONFIG_ENV: !Ref ModelSelectionAppConfigEnv
          APPCONFIG_PROFILE: !Ref ModelSelectionConfigProfile
          FAILURE_SIM_PREFIX: /genai/model-selection/simulate-failure/
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - "arn:aws:bedrock:*:*:model/*"
                - "arn:aws:bedrock:*:*:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParametersByPath
                - ssm:PutParameter
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/genai/model-selection/simulate-failure/*"
            - Effect: Allow
              Action:
                - appconfig:GetLatestConfiguration
                - appconfig:StartConfigurationSession
              Resource: "*"
            - Effect: Allow
              Action:
                - appconfig:CreateHostedConfigurationVersion
                - appconfig:StartDeployment
                - appconfig:GetHostedConfigurationVersion
                - appconfig:ListHostedConfigurationVersions
              Resource:
                - !Sub "arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${ModelSelectionAppConfigApp}"
                - !Sub "arn:aws:appconfig:${AWS::Region}:${AWS::AccountId}:application/${ModelSelectionAppConfigApp}/*"
            - Effect: Allow
              Action:
                - appconfig:GetDeploymentStrategy
                - appconfig:ListDeploymentStrategies
              Resource: "*"
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref ModelSelectionApi
            Path: /query
            Method: post
        HealthApi:
          Type: Api
          Properties:
            RestApiId: !Ref ModelSelectionApi
            Path: /health
            Method: get
        AdminApi:
          Type: Api
          Properties:
            RestApiId: !Ref ModelSelectionApi
            Path: /admin/simulate-failure
            Method: post
        AdminConfigGetApi:
          Type: Api
          Properties:
            RestApiId: !Ref ModelSelectionApi
            Path: /admin/config
            Method: get
        AdminConfigPutApi:
          Type: Api
          Properties:
            RestApiId: !Ref ModelSelectionApi
            Path: /admin/config
            Method: put

  # SSM Parameters for failure simulation
  FailureSimAnthropicParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /genai/model-selection/simulate-failure/anthropic
      Type: String
      Value: "none"
      Description: "Failure simulation for anthropic provider (none|error|timeout)"

  FailureSimAmazonParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /genai/model-selection/simulate-failure/amazon
      Type: String
      Value: "none"
      Description: "Failure simulation for amazon provider (none|error|timeout)"

  FailureSimMetaParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /genai/model-selection/simulate-failure/meta
      Type: String
      Value: "none"
      Description: "Failure simulation for meta provider (none|error|timeout)"

  # CloudWatch Dashboard
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: GenAI-Model-Selection
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "## Custom Metrics (Application Layer)"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Model Invocations by Provider",
                "metrics": [
                  ["GenAI/ModelSelection", "Invocations", "Provider", "anthropic"],
                  ["GenAI/ModelSelection", "Invocations", "Provider", "amazon"],
                  ["GenAI/ModelSelection", "Invocations", "Provider", "meta"]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Latency by Model",
                "metrics": [
                  ["GenAI/ModelSelection", "Latency", "Model", "claude-sonnet"],
                  ["GenAI/ModelSelection", "Latency", "Model", "nova-pro"],
                  ["GenAI/ModelSelection", "Latency", "Model", "nova-lite"]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Circuit Breaker State",
                "metrics": [
                  ["GenAI/ModelSelection", "CircuitBreakerOpen", "Provider", "anthropic"],
                  ["GenAI/ModelSelection", "CircuitBreakerOpen", "Provider", "amazon"]
                ],
                "period": 60,
                "stat": "Maximum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Estimated Cost (USD)",
                "metrics": [
                  ["GenAI/ModelSelection", "EstimatedCost", "Provider", "anthropic"],
                  ["GenAI/ModelSelection", "EstimatedCost", "Provider", "amazon"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "text",
              "width": 24,
              "height": 1,
              "properties": {
                "markdown": "## Bedrock Standard Metrics (AWS/Bedrock)"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Bedrock Invocations (Standard)",
                "metrics": [
                  ["AWS/Bedrock", "Invocations", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro"}],
                  ["AWS/Bedrock", "Invocations", "ModelId", "amazon.nova-lite-v1:0", {"label": "Nova Lite"}]
                ],
                "period": 60,
                "stat": "SampleCount",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Bedrock Invocation Latency (Standard)",
                "metrics": [
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet"}],
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro"}],
                  ["AWS/Bedrock", "InvocationLatency", "ModelId", "amazon.nova-lite-v1:0", {"label": "Nova Lite"}]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "yAxis": {"left": {"label": "ms"}}
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Bedrock Token Usage (Standard)",
                "metrics": [
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet (Input)"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet (Output)"}],
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro (Input)"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro (Output)"}],
                  ["AWS/Bedrock", "InputTokenCount", "ModelId", "amazon.nova-lite-v1:0", {"label": "Nova Lite (Input)"}],
                  ["AWS/Bedrock", "OutputTokenCount", "ModelId", "amazon.nova-lite-v1:0", {"label": "Nova Lite (Output)"}]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Bedrock Errors & Throttles (Standard)",
                "metrics": [
                  ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet (ClientErr)"}],
                  ["AWS/Bedrock", "InvocationServerErrors", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet (ServerErr)"}],
                  ["AWS/Bedrock", "InvocationThrottles", "ModelId", "us.anthropic.claude-sonnet-4-5-20250929-v1:0", {"label": "Claude Sonnet (Throttle)"}],
                  ["AWS/Bedrock", "InvocationClientErrors", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro (ClientErr)"}],
                  ["AWS/Bedrock", "InvocationServerErrors", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro (ServerErr)"}],
                  ["AWS/Bedrock", "InvocationThrottles", "ModelId", "amazon.nova-pro-v1:0", {"label": "Nova Pro (Throttle)"}]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ModelSelectionApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=GenAI-Model-Selection"
