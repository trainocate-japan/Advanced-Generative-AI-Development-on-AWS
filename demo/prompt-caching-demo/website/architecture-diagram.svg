<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" style="background: #FAFAFA;">
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="diagram-title" style="font-size: 20px; font-weight: 700; fill: #232F3E;">
    Prompt Caching Architecture
  </text>
  
  <!-- Student/Browser -->
  <g class="component-box" data-tooltip="🌐 Student Browser&#10;&#10;The web interface where students interact with the demo. Built with vanilla JavaScript, HTML, and CSS. Submits questions via HTTPS POST requests to the API Gateway and displays formatted results with cache performance metrics.">
    <rect x="50" y="80" width="180" height="100" rx="8" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <text x="140" y="115" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">Student Browser</text>
    <text x="140" y="135" text-anchor="middle" class="component-subtitle" style="font-size: 11px; fill: #666;">Web Interface</text>
    <text x="140" y="155" text-anchor="middle" style="font-size: 24px;">🌐</text>
  </g>
  
  <!-- CloudFront -->
  <g class="component-box" data-tooltip="☁️ Amazon CloudFront&#10;&#10;Global CDN that serves the static website with low latency. Provides HTTPS encryption, caching at edge locations, and Origin Access Identity (OAI) for secure S3 access. Deployed via CDK with custom domain support.">
    <rect x="320" y="80" width="180" height="100" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <image href="aws-cloudfront-icon.svg" x="380" y="90" width="60" height="60"/>
    <text x="410" y="165" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">CloudFront</text>
  </g>
  
  <!-- S3 Website Bucket -->
  <g class="component-box" data-tooltip="🪣 S3 Website Bucket&#10;&#10;Stores all static website assets: HTML, CSS, JavaScript, SVG diagrams, and icons. Configured as a static website host with CloudFront OAI for secure access. Automatically deployed via CDK with versioning enabled.">
    <rect x="590" y="80" width="180" height="100" rx="8" fill="#E1F5FE" stroke="#00BCD4" stroke-width="2"/>
    <image href="aws-s3-icon.svg" x="650" y="90" width="60" height="60"/>
    <text x="680" y="165" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">S3 Website</text>
  </g>
  
  <!-- API Gateway -->
  <g class="component-box" data-tooltip="🚪 API Gateway&#10;&#10;REST API with two endpoints: POST /query for question submission and GET /health for monitoring. Handles CORS, request validation, and Lambda integration. Provides the public API URL injected into the website config.">
    <rect x="320" y="250" width="180" height="100" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
    <image href="aws-api-gateway-icon.svg" x="380" y="260" width="60" height="60"/>
    <text x="410" y="340" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">API Gateway</text>
  </g>
  
  <!-- Lambda Function -->
  <g class="component-box" data-tooltip="⚡ Lambda Function (query_handler.py)&#10;&#10;Python 3.12 function that orchestrates the demo. Makes 3 Bedrock calls: (1) Baseline without cache, (2) Cache write with checkpoint, (3) Cache hit. Loads documents from S3, implements rate limiting, validates inputs, and returns structured metrics comparing performance.">
    <rect x="590" y="250" width="180" height="100" rx="8" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
    <image href="aws-lambda-icon.svg" x="650" y="260" width="60" height="60"/>
    <text x="680" y="340" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">Lambda</text>
  </g>
  
  <!-- S3 Document Bucket -->
  <g class="component-box" data-tooltip="📄 S3 Document Bucket&#10;&#10;Stores the 1997 Amazon shareholder letter (Shareholderletter97.txt) used as the cached document context. The Lambda function loads this document for each query session. Large enough (~3500 tokens) to demonstrate meaningful cache benefits.">
    <rect x="860" y="250" width="180" height="100" rx="8" fill="#E1F5FE" stroke="#00BCD4" stroke-width="2"/>
    <image href="aws-s3-icon.svg" x="920" y="260" width="60" height="60"/>
    <text x="950" y="340" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">S3 Documents</text>
  </g>
  
  <!-- Bedrock API -->
  <g class="component-box" data-tooltip="🤖 Amazon Bedrock&#10;&#10;Managed AI service providing access to foundation models (Claude, Nova). Uses the Converse API with prompt caching enabled via cachePoint markers. Supports models: Claude 3.5 Sonnet/Haiku, Nova Lite/Pro. Caches document context to reduce tokens and latency.">
    <rect x="590" y="420" width="180" height="120" rx="8" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
    <image href="aws-bedrock-icon.svg" x="650" y="435" width="60" height="60"/>
    <text x="680" y="515" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">Amazon Bedrock</text>
    <text x="680" y="530" text-anchor="middle" class="component-subtitle" style="font-size: 10px; fill: #9C27B0; font-weight: 600;">Prompt Caching</text>
  </g>
  
  <!-- Cache Storage (conceptual) -->
  <g class="component-box" data-tooltip="💾 Prompt Cache Storage&#10;&#10;Bedrock's internal cache stores prompt prefixes for 5 minutes from last use. Cache reads cost 90% less than regular input tokens. Cache writes cost 25% more but enable subsequent savings. Minimum 1024 tokens required for caching. TTL resets on each cache hit.">
    <rect x="860" y="420" width="180" height="120" rx="8" fill="#FFF9C4" stroke="#827717" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="950" y="465" text-anchor="middle" style="font-size: 32px;">💾</text>
    <text x="950" y="495" text-anchor="middle" class="component-title" style="font-size: 14px; font-weight: 600; fill: #232F3E;">Cache Storage</text>
    <text x="950" y="510" text-anchor="middle" class="component-subtitle" style="font-size: 11px; fill: #666;">5-minute TTL</text>
    <text x="950" y="525" text-anchor="middle" class="component-subtitle" style="font-size: 10px; fill: #827717;">Reduced pricing</text>
  </g>
  
  <!-- Flow Arrows -->
  <!-- Browser to CloudFront -->
  <g class="flow-line">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#666" />
      </marker>
    </defs>
    <line x1="230" y1="130" x2="320" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="275" y="120" text-anchor="middle" style="font-size: 10px; fill: #666;">HTTPS</text>
  </g>
  
  <!-- CloudFront to S3 Website -->
  <g class="flow-line">
    <line x1="500" y1="130" x2="590" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="545" y="120" text-anchor="middle" style="font-size: 10px; fill: #666;">OAI</text>
  </g>
  
  <!-- Browser to API Gateway -->
  <g class="flow-line">
    <path d="M 140 180 L 140 220 L 320 220 L 320 280" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="180" y="210" style="font-size: 10px; fill: #666;">POST /query</text>
  </g>
  
  <!-- API Gateway to Lambda -->
  <g class="flow-line">
    <line x1="500" y1="300" x2="590" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="545" y="290" text-anchor="middle" style="font-size: 10px; fill: #666;">Invoke</text>
  </g>
  
  <!-- Lambda to S3 Documents -->
  <g class="flow-line">
    <line x1="770" y1="300" x2="860" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="815" y="290" text-anchor="middle" style="font-size: 10px; fill: #666;">Load Doc</text>
  </g>
  
  <!-- Lambda to Bedrock -->
  <g class="flow-line">
    <line x1="680" y1="350" x2="680" y2="420" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="720" y="385" style="font-size: 10px; fill: #666;">3 Requests:</text>
    <text x="720" y="400" style="font-size: 9px; fill: #666;">1. Baseline</text>
    <text x="720" y="412" style="font-size: 9px; fill: #666;">2. Cache Write</text>
  </g>
  
  <!-- Bedrock to Cache -->
  <g class="flow-line">
    <line x1="770" y1="480" x2="860" y2="480" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="815" y="470" text-anchor="middle" style="font-size: 10px; fill: #9C27B0;">Cache Write</text>
  </g>
  
  <!-- Cache to Bedrock -->
  <g class="flow-line">
    <line x1="860" y1="500" x2="770" y2="500" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="815" y="515" text-anchor="middle" style="font-size: 10px; fill: #4CAF50;">Cache Read</text>
  </g>
  
  <!-- Return path annotation -->
  <g>
    <text x="680" y="565" text-anchor="middle" style="font-size: 9px; fill: #666;">3. Cache Hit</text>
    <path d="M 680 570 L 680 600 L 140 600 L 140 180" fill="none" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
    <text x="400" y="615" text-anchor="middle" style="font-size: 10px; fill: #4CAF50;">Results with Metrics</text>
  </g>
  
  <!-- Legend -->
  <g>
    <rect x="50" y="650" width="1100" height="120" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1"/>
    <text x="70" y="675" style="font-size: 12px; font-weight: 600; fill: #232F3E;">Data Flow:</text>
    
    <line x1="70" y1="695" x2="110" y2="695" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="120" y="700" style="font-size: 11px; fill: #666;">Standard Request</text>
    
    <line x1="250" y1="695" x2="290" y2="695" stroke="#9C27B0" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="300" y="700" style="font-size: 11px; fill: #666;">Cache Write (premium pricing)</text>
    
    <line x1="500" y1="695" x2="540" y2="695" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="550" y="700" style="font-size: 11px; fill: #666;">Cache Read (reduced pricing)</text>
    
    <line x1="750" y1="695" x2="790" y2="695" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
    <text x="800" y="700" style="font-size: 11px; fill: #666;">Response Path</text>
    
    <text x="70" y="730" style="font-size: 11px; font-weight: 600; fill: #232F3E;">Key Metrics:</text>
    <text x="70" y="750" style="font-size: 10px; fill: #666;">• Baseline: Full document processing (~3500 tokens)</text>
    <text x="400" y="750" style="font-size: 10px; fill: #666;">• Cache Write: Document cached for 5 minutes</text>
    <text x="750" y="750" style="font-size: 10px; fill: #666;">• Cache Hit: Only question processed (~300 tokens)</text>
  </g>
</svg>
